<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#d97932"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c45}.title{font-size:30px;font-weight:600}.sub{font-size:18px;fill:#537078}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0cc;stroke:#6d878a;stroke-width:2}.steel{fill:#66848a}.ghost{fill:none;stroke:#94a9ae;stroke-width:3;stroke-dasharray:8 7}.move{fill:none;stroke:#d97932;stroke-width:4;marker-end:url(#arrow)}.water{fill:#ddecf0}</style><rect width="1200" height="660" fill="#f7f9f6"/><text x="38" y="49" class="title">压重跷跷板 / weight-seesaw</text><text x="38" y="84" class="sub">侧视：沿 −Z 行驶；板自重对称，球重改变力矩，非定时摆动。</text><rect x="40" y="440" width="1120" height="95" rx="2" class="water"/><rect x="65" y="360" width="240" height="25" rx="2" class="deck"/><rect x="735" y="360" width="240" height="25" rx="2" class="deck"/><polygon points="470,459 575,459 523,320" class="steel"/><g transform="rotate(-8 523 330)"><rect x="303" y="316" width="440" height="26" rx="2" class="deck"/><circle cx="373" cy="295" r="18" fill="white" stroke="#203c45" stroke-width="2"/></g><g transform="rotate(8 523 330)"><rect x="303" y="316" width="440" height="26" rx="2" class="ghost"/></g><circle cx="523" cy="330" r="8" fill="white" stroke="#203c45" stroke-width="2"/><text x="75" y="340" class="label">入口低岸</text><text x="783" y="340" class="label">出口低岸</text><text x="440" y="500" class="label">固定横轴 X / 单个真实铰链</text><path d="M372 252L635 214" class="move"/><text x="435" y="192" class="label">球过中轴 → 另一端被压低</text><text x="778" y="225" class="label">实线：入口端低</text><text x="778" y="265" class="label">虚线：出口端低</text><text x="778" y="305" class="label">板端到低位后滚动离开</text><text x="38" y="590" class="small">候选：长5 m、宽2.2 m、限角±8°；低端对齐Y3.4，空载弱弹簧使入口端回到低位。</text><text x="38" y="628" class="sub">内部结构与运动示意，非成品模型、非试玩证据；尺寸以主文档候选参数为准。</text></svg>