<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#d97932"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c45}.title{font-size:30px;font-weight:600}.sub{font-size:18px;fill:#537078}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0cc;stroke:#6d878a;stroke-width:2}.steel{fill:#66848a}.ghost{fill:none;stroke:#94a9ae;stroke-width:3;stroke-dasharray:8 7}.move{fill:none;stroke:#d97932;stroke-width:4;marker-end:url(#arrow)}.water{fill:#ddecf0}</style><rect width="1200" height="660" fill="#f7f9f6"/><text x="38" y="49" class="title">摆动吊桥 / sway-cradle-bridge</text><text x="38" y="84" class="sub">端视：选择单刚体吊篮式桥，绕上方水平Z轴受驱摆动；不模拟软绳和多块桥板。</text><rect x="38" y="476" width="1124" height="70" rx="2" class="water"/><rect x="96" y="155" width="505" height="20" rx="2" class="steel"/><circle cx="349" cy="180" r="9" fill="white" stroke="#203c45" stroke-width="2"/><path d="M349 180L349 436" class="ghost"/><g transform="rotate(-9 349 180)"><path d="M220 182V421H478V182" fill="none" stroke="#66848a" stroke-width="10"/><rect x="239" y="422" width="220" height="23" rx="2" class="deck"/><circle cx="336" cy="399" r="18" fill="white" stroke="#203c45" stroke-width="2"/></g><path d="M258 464 Q349 492 440 464" class="move"/><text x="170" y="525" class="label">端视：桥面横移 + 抬升 + 横向倾斜</text><text x="687" y="190" class="label">固定上轴 Z / 可见驱动器</text><text x="687" y="244" class="label">单块刚性桥面与刚性吊架</text><text x="687" y="293" class="label">φ=±9°，悬高2.8 m，周期10 s</text><text x="687" y="342" class="label">中央位置接近水平，择时上岸</text><text x="687" y="391" class="label">无绳索软体、无多节桥铰链</text><text x="687" y="440" class="label">沿 −Z 穿过画面，左右纠偏</text><text x="38" y="590" class="small">候选：桥面2.4×5 m；最大横移约0.438 m、中心抬升约0.034 m；不是平移台换吊绳外观。</text><text x="38" y="628" class="sub">内部结构与运动示意，非成品模型、非试玩证据；尺寸以主文档候选参数为准。</text></svg>