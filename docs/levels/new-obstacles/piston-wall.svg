<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#d97932"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c45}.title{font-size:30px;font-weight:600}.sub{font-size:18px;fill:#537078}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0cc;stroke:#6d878a;stroke-width:2}.steel{fill:#66848a}.ghost{fill:none;stroke:#94a9ae;stroke-width:3;stroke-dasharray:8 7}.move{fill:none;stroke:#d97932;stroke-width:4;marker-end:url(#arrow)}.water{fill:#ddecf0}</style><rect width="1200" height="660" fill="#f7f9f6"/><text x="38" y="49" class="title">伸缩推墙 / piston-wall</text><text x="38" y="84" class="sub">俯视：行进向右，推墙从上侧伸向下侧；躲避袋在危险带前后，不在撞击正对面。</text><rect x="60" y="140" width="1080" height="410" rx="2" class="water"/><rect x="185" y="165" width="755" height="245" rx="2" class="deck"/><rect x="358" y="410" width="145" height="105" rx="2" class="deck"/><rect x="725" y="410" width="145" height="105" rx="2" class="deck"/><rect x="535" y="80" width="155" height="80" rx="2" class="steel"/><rect x="564" y="117" width="95" height="42" rx="2" class="steel"/><rect x="539" y="162" width="150" height="25" rx="2" class="deck"/><rect x="539" y="162" width="150" height="275" rx="2" class="ghost"/><path d="M614 208L614 384" class="move"/><circle cx="421" cy="458" r="18" fill="white" stroke="#203c45" stroke-width="2"/><path d="M256 290L407 290" class="move"/><path d="M457 290L830 290" class="move"/><text x="198" y="145" class="label">入口 / −Z →</text><text x="361" y="540" class="label">前等待袋</text><text x="733" y="540" class="label">后等待袋</text><text x="734" y="465" class="label">退入袋区，避开纵向扫带</text><text x="721" y="201" class="label">预告 → 伸出 → 停留 → 回收</text><text x="721" y="242" class="label">橙箭头：横向 +X 推挤</text><text x="95" y="478" class="label">开放水侧</text><text x="38" y="590" class="small">候选：路宽3.2 m、危险带长1.6 m；1.0 s预告、1.6 s伸出、0.8 s停留、1.6 s回收。</text><text x="38" y="628" class="sub">内部结构与运动示意，非成品模型、非试玩证据；尺寸以主文档候选参数为准。</text></svg>