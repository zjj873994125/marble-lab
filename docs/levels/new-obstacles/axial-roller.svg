<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#d97932"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c45}.title{font-size:30px;font-weight:600}.sub{font-size:18px;fill:#537078}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0cc;stroke:#6d878a;stroke-width:2}.steel{fill:#66848a}.ghost{fill:none;stroke:#94a9ae;stroke-width:3;stroke-dasharray:8 7}.move{fill:none;stroke:#d97932;stroke-width:4;marker-end:url(#arrow)}.water{fill:#ddecf0}</style><rect width="1200" height="660" fill="#f7f9f6"/><text x="38" y="49" class="title">轴向滚筒桥 / axial-roller</text><text x="38" y="84" class="sub">沿筒长前进，滚筒绕水平Z轴自转；曲面下滑与横向表面速度共同造成平衡挑战。</text><rect x="40" y="455" width="1120" height="80" rx="2" class="water"/><rect x="70" y="360" width="205" height="24" rx="2" class="deck"/><rect x="775" y="360" width="180" height="24" rx="2" class="deck"/><rect x="290" y="360" width="470" height="75" rx="2" class="steel"/><path d="M315 345L738 345" class="move"/><circle cx="345" cy="339" r="18" fill="white" stroke="#203c45" stroke-width="2"/><text x="93" y="330" class="label">宽入口岛</text><text x="798" y="330" class="label">出口岛</text><text x="390" y="464" class="label">侧视：沿滚筒轴 −Z 前进</text><circle cx="610" cy="225" r="83" fill="#fff0cc" stroke="#6d878a" stroke-width="3"/><circle cx="610" cy="123" r="18" fill="white" stroke="#203c45" stroke-width="2"/><path d="M551 190 A66 66 0 0 1 672 214" class="move"/><path d="M596 110L692 110" class="move"/><text x="718" y="167" class="label">截面：顶部接触面向 +X 滚</text><text x="718" y="211" class="label">摇杆同时向前与向 −X 纠偏</text><text x="718" y="252" class="label">不是站在平盒上转贴图</text><text x="355" y="230" class="label">半径1 m</text><text x="38" y="590" class="small">候选：长5 m、半径1 m、ω=0.45 rad/s；顶部线速度0.45 m/s。刹车不把球锁到筒面。</text><text x="38" y="628" class="sub">内部结构与运动示意，非成品模型、非试玩证据；尺寸以主文档候选参数为准。</text></svg>