<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#d97932"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203c45}.title{font-size:30px;font-weight:600}.sub{font-size:18px;fill:#537078}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0cc;stroke:#6d878a;stroke-width:2}.steel{fill:#66848a}.ghost{fill:none;stroke:#94a9ae;stroke-width:3;stroke-dasharray:8 7}.move{fill:none;stroke:#d97932;stroke-width:4;marker-end:url(#arrow)}.water{fill:#ddecf0}</style><rect width="1200" height="660" fill="#f7f9f6"/><text x="38" y="49" class="title">定时翻板 / timed-trapdoor</text><text x="38" y="84" class="sub">状态示意：板绕侧边Z轴向下翻90°；开口真的露空，非消失材质或透明承托。</text><rect x="30" y="465" width="1140" height="80" rx="2" class="water"/><text x="57" y="149" class="label">闭合：整块承托</text><rect x="53" y="205" width="315" height="225" rx="2" class="ghost"/><rect x="53" y="205" width="12" height="225" rx="2" class="steel"/><text x="447" y="149" class="label">翻下：承托面离开</text><rect x="443" y="205" width="315" height="225" rx="2" class="ghost"/><rect x="443" y="205" width="12" height="225" rx="2" class="steel"/><text x="837" y="149" class="label">打开：中间落水</text><rect x="833" y="205" width="315" height="225" rx="2" class="ghost"/><rect x="833" y="205" width="12" height="225" rx="2" class="steel"/><rect x="65" y="205" width="290" height="225" rx="2" class="deck"/><circle cx="210" cy="307" r="18" fill="white" stroke="#203c45" stroke-width="2"/><path d="M210 396L210 236" class="move"/><polygon points="455,205 614,242 614,467 455,430" class="deck"/><path d="M646 288L684 439" class="move"/><rect x="845" y="205" width="19" height="225" rx="2" class="deck"/><circle cx="1005" cy="400" r="18" fill="white" stroke="#203c45" stroke-width="2"/><path d="M1005 360L1005 458" class="move"/><text x="58" y="482" class="label">长轴侧边铰链 Z</text><text x="459" y="516" class="label">板持续保留真实旋转碰撞</text><text x="882" y="482" class="label">无水平隐形底板</text><text x="38" y="590" class="small">候选：宽2.2 m、长3 m；闭合4.5 s（末0.9 s预告）、下翻1.0 s、打开1.5 s、回位1.5 s。</text><text x="38" y="628" class="sub">内部结构与运动示意，非成品模型、非试玩证据；尺寸以主文档候选参数为准。</text></svg>