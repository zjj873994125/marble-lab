<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d07a36"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#27424b}.title{font-size:32px;font-weight:600}.sub{font-size:18px;fill:#59777c}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0c9;stroke:#5f7e85;stroke-width:2}.metal{fill:#6f878c;stroke:#47646d;stroke-width:2}.zone{fill:#b4dcea;fill-opacity:.5;stroke:#3d8bb1;stroke-dasharray:6 5;stroke-width:2}.rail{fill:none;stroke:#6f878c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#91a4a4;stroke-dasharray:7 6;stroke-width:2}.move{fill:none;stroke:#d07a36;stroke-width:3;marker-end:url(#arr)}</style><rect width="1440" height="900" fill="#f5f8f4"/><rect x="30" y="125" width="900" height="575" rx="12" fill="#e3efeb"/><rect x="955" y="125" width="455" height="575" rx="12" fill="white" stroke="#dce5dd"/><text x="34" y="49" class="title">反转输送带桥 / reversing-conveyor</text><text x="34" y="88" class="sub">结构、作用与状态设计示意；所有参数候选，未实施、未物理验证。</text><rect x="50" y="387" width="120" height="25" rx="3" class="deck"/><rect x="757" y="387" width="136" height="25" rx="3" class="deck"/><circle cx="209" cy="453" r="52" class="metal"/><circle cx="711" cy="453" r="52" class="metal"/><polyline points="209.00,401.00 711.00,401.00 762.00,453.00 711.00,505.00 209.00,505.00 157.00,453.00 209.00,401.00" class="ghost"/><rect x="210" y="389" width="35" height="20" rx="3" class="deck"/><rect x="248" y="389" width="35" height="20" rx="3" class="deck"/><rect x="286" y="389" width="35" height="20" rx="3" class="deck"/><rect x="324" y="389" width="35" height="20" rx="3" class="deck"/><rect x="362" y="389" width="35" height="20" rx="3" class="deck"/><rect x="400" y="389" width="35" height="20" rx="3" class="deck"/><rect x="438" y="389" width="35" height="20" rx="3" class="deck"/><rect x="476" y="389" width="35" height="20" rx="3" class="deck"/><rect x="514" y="389" width="35" height="20" rx="3" class="deck"/><rect x="552" y="389" width="35" height="20" rx="3" class="deck"/><rect x="590" y="389" width="35" height="20" rx="3" class="deck"/><rect x="628" y="389" width="35" height="20" rx="3" class="deck"/><rect x="666" y="389" width="35" height="20" rx="3" class="deck"/><circle cx="448" cy="365" r="19" fill="white" stroke="#29444d" stroke-width="2"/><polyline points="532.00,360.00 376.00,360.00" class="move"/><polyline points="332.00,522.00 611.00,522.00" class="move"/><text x="111" y="265" class="label">顶面固定位置 / 宽1.4m / 有效长6m</text><text x="259" y="568" class="label">约32板条闭环 / 下层回程</text><text x="267" y="613" class="label">非UV滚动；反转时真实接触速度变化</text><text x="977" y="166" class="label">方向保持</text><text x="977" y="197" class="small">每方向保持2.2s，末.8s预告。</text><text x="977" y="248" class="label">可见反转</text><text x="977" y="279" class="small">.6s降速→.3s停→.6s反向加速。</text><text x="977" y="330" class="label">动力来源</text><text x="977" y="361" class="small">运动板条/端鼓经摩擦带球，不直接给球伪拖力。</text><text x="977" y="412" class="label">负担</text><text x="977" y="443" class="small">约32持久代理，禁止每帧创建/销毁。</text><rect x="42.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="54.0" y="774" class="small">正向保持</text><rect x="375.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="387.0" y="774" class="small">减速 / 停</text><rect x="708.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="720.0" y="774" class="small">反向保持</text><rect x="1041.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="1053.0" y="774" class="small">回转</text><text x="34" y="850" class="sub">实线构件需对应真实碰撞；虚线为轨迹、作用区或备选姿态，不是隐藏承托。</text></svg>