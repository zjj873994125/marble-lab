<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d07a36"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#27424b}.title{font-size:32px;font-weight:600}.sub{font-size:18px;fill:#59777c}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0c9;stroke:#5f7e85;stroke-width:2}.metal{fill:#6f878c;stroke:#47646d;stroke-width:2}.zone{fill:#b4dcea;fill-opacity:.5;stroke:#3d8bb1;stroke-dasharray:6 5;stroke-width:2}.rail{fill:none;stroke:#6f878c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#91a4a4;stroke-dasharray:7 6;stroke-width:2}.move{fill:none;stroke:#d07a36;stroke-width:3;marker-end:url(#arr)}</style><rect width="1440" height="900" fill="#f5f8f4"/><rect x="30" y="125" width="900" height="575" rx="12" fill="#e3efeb"/><rect x="955" y="125" width="455" height="575" rx="12" fill="white" stroke="#dce5dd"/><text x="34" y="49" class="title">巡航接球斗 / orbital-catcher</text><text x="34" y="88" class="sub">结构、作用与状态设计示意；所有参数候选，未实施、未物理验证。</text><ellipse cx="400" cy="384" rx="165" ry="74" class="ghost"/><circle cx="400" cy="458" r="86" class="deck"/><circle cx="400" cy="458" r="47" class="ghost"/><circle cx="400" cy="458" r="19" fill="white" stroke="#29444d" stroke-width="2"/><circle cx="565" cy="384" r="86" class="ghost"/><rect x="668" y="341" width="212" height="86" rx="3" class="deck"/><polyline points="591.00,381.00 665.00,381.00" class="move"/><polyline points="128.00,581.00 232.00,523.00 340.00,475.00" class="ghost"/><text x="91" y="627" class="label">真实弹道到来</text><text x="237" y="278" class="label">椭圆巡航 X±1 / Z±.4 / T6s</text><text x="649" y="465" class="label">dock接岸 / .15m缝</text><text x="310" y="572" class="label">凹斗r1.2 / 核心r.7</text><text x="977" y="166" class="label">不是追球平台</text><text x="977" y="197" class="small">巡航轨迹不随空中球改变。只有真实入斗接触才刹停。</text><text x="977" y="248" class="label">连续机械过程</text><text x="977" y="279" class="small">.35s减速→.65s稳定→沿轨送到出口。</text><text x="977" y="330" class="label">出口1秒</text><text x="977" y="361" class="small">不绑球；来不及下斗可再绕一圈。</text><text x="977" y="412" class="label">凹面碰撞</text><text x="977" y="443" class="small">12–16可触楔面，不用填满斗口的凸包。</text><rect x="42.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="54.0" y="774" class="small">巡航</text><rect x="375.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="387.0" y="774" class="small">真实落斗减速</text><rect x="708.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="720.0" y="774" class="small">稳定后运送</text><rect x="1041.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="1053.0" y="774" class="small">dock / 离斗</text><text x="34" y="850" class="sub">实线构件需对应真实碰撞；虚线为轨迹、作用区或备选姿态，不是隐藏承托。</text></svg>