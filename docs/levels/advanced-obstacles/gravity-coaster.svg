<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d07a36"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#27424b}.title{font-size:32px;font-weight:600}.sub{font-size:18px;fill:#59777c}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0c9;stroke:#5f7e85;stroke-width:2}.metal{fill:#6f878c;stroke:#47646d;stroke-width:2}.zone{fill:#b4dcea;fill-opacity:.5;stroke:#3d8bb1;stroke-dasharray:6 5;stroke-width:2}.rail{fill:none;stroke:#6f878c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#91a4a4;stroke-dasharray:7 6;stroke-width:2}.move{fill:none;stroke:#d07a36;stroke-width:3;marker-end:url(#arr)}</style><rect width="1440" height="900" fill="#f5f8f4"/><rect x="30" y="125" width="900" height="575" rx="12" fill="#e3efeb"/><rect x="955" y="125" width="455" height="575" rx="12" fill="white" stroke="#dce5dd"/><text x="34" y="49" class="title">重力过山车弯轨 / gravity-coaster</text><text x="34" y="88" class="sub">结构、作用与状态设计示意；所有参数候选，未实施、未物理验证。</text><text x="61" y="171" class="label">先做：开放重力曲轨</text><polyline points="72.00,246.00 158.00,246.00 237.00,280.00 295.00,352.00 370.00,392.00 447.00,400.00 538.00,400.00 618.00,372.00 674.00,350.00 752.00,345.00" class="rail"/><polyline points="72.00,262.00 158.00,262.00 237.00,296.00 295.00,368.00 370.00,408.00 447.00,416.00 538.00,416.00 618.00,388.00 674.00,366.00 752.00,361.00" class="rail"/><circle cx="149" cy="230" r="19" fill="white" stroke="#29444d" stroke-width="2"/><text x="68" y="211" class="label">5.2m</text><text x="363" y="449" class="label">3.4m / 落差1.8m</text><text x="660" y="322" class="label">4.2m</text><text x="445" y="486" class="label">平面R4转90° / 倾斜32°</text><circle cx="260" cy="569" r="87" class="ghost"/><circle cx="260" cy="482" r="12" fill="white" stroke="#29444d" stroke-width="2"/><text x="367" y="553" class="label">完整环子方案：球心R3m</text><text x="367" y="588" class="label">顶速≥6.93 / 底速≥15.49</text><text x="367" y="622" class="label">被动质点模型；当前水平限速7</text><text x="977" y="166" class="label">曲率需算球心轨迹</text><text x="977" y="197" class="small">首版竖向R4，避免急凸顶把球意外抛离。</text><text x="977" y="248" class="label">完整环非天然可行</text><text x="977" y="279" class="small">R3被动点质量需要底速15.49，大于当前7。</text><text x="977" y="330" class="label">控制输入也要入账</text><text x="977" y="361" class="small">默认灵敏度1的乐观半环做功仍不足样例压轨；更高设</text><text x="977" y="388" class="small">置另算。</text><text x="977" y="439" class="label">未来能力</text><text x="977" y="470" class="small">局部限速例外或可见内外导轨必须另行批准，不藏磁吸</text><text x="977" y="497" class="small">。</text><rect x="42.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="54.0" y="774" class="small">高岸控速</text><rect x="375.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="387.0" y="774" class="small">凹弧加速</text><rect x="708.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="720.0" y="774" class="small">倾斜弯纠偏</text><rect x="1041.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="1053.0" y="774" class="small">小坡出端</text><text x="34" y="850" class="sub">实线构件需对应真实碰撞；虚线为轨迹、作用区或备选姿态，不是隐藏承托。</text></svg>