<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d07a36"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#27424b}.title{font-size:32px;font-weight:600}.sub{font-size:18px;fill:#59777c}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0c9;stroke:#5f7e85;stroke-width:2}.metal{fill:#6f878c;stroke:#47646d;stroke-width:2}.zone{fill:#b4dcea;fill-opacity:.5;stroke:#3d8bb1;stroke-dasharray:6 5;stroke-width:2}.rail{fill:none;stroke:#6f878c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#91a4a4;stroke-dasharray:7 6;stroke-width:2}.move{fill:none;stroke:#d07a36;stroke-width:3;marker-end:url(#arr)}</style><rect width="1440" height="900" fill="#f5f8f4"/><rect x="30" y="125" width="900" height="575" rx="12" fill="#e3efeb"/><rect x="955" y="125" width="455" height="575" rx="12" fill="white" stroke="#dce5dd"/><text x="34" y="49" class="title">双轴天平台 / gimbal-platform</text><text x="34" y="88" class="sub">结构、作用与状态设计示意；所有参数候选，未实施、未物理验证。</text><rect x="245" y="258" width="330" height="330" rx="3" class="metal"/><rect x="277" y="290" width="266" height="266" rx="3" class="deck"/><polyline points="410.00,251.00 410.00,574.00" class="ghost"/><polyline points="244.00,423.00 580.00,423.00" class="ghost"/><rect x="337" y="607" width="145" height="62" rx="3" class="deck"/><rect x="67" y="356" width="145" height="145" rx="3" class="deck"/><polyline points="410.00,648.00 410.00,568.00" class="move"/><polyline points="280.00,424.00 216.00,424.00" class="move"/><circle cx="370" cy="441" r="19" fill="white" stroke="#29444d" stroke-width="2"/><text x="591" y="424" class="label">外轴X</text><text x="429" y="239" class="label">内轴Z</text><text x="608" y="558" class="label">3.2×3.2m板</text><text x="73" y="322" class="label">邻边出口−X</text><text x="535" y="651" class=