<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d07a36"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#27424b}.title{font-size:32px;font-weight:600}.sub{font-size:18px;fill:#59777c}.label{font-size:20px}.small{font-size:17px}.deck{fill:#fff0c9;stroke:#5f7e85;stroke-width:2}.metal{fill:#6f878c;stroke:#47646d;stroke-width:2}.zone{fill:#b4dcea;fill-opacity:.5;stroke:#3d8bb1;stroke-dasharray:6 5;stroke-width:2}.rail{fill:none;stroke:#6f878c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#91a4a4;stroke-dasharray:7 6;stroke-width:2}.move{fill:none;stroke:#d07a36;stroke-width:3;marker-end:url(#arr)}</style><rect width="1440" height="900" fill="#f5f8f4"/><rect x="30" y="125" width="900" height="575" rx="12" fill="#e3efeb"/><rect x="955" y="125" width="455" height="575" rx="12" fill="white" stroke="#dce5dd"/><text x="34" y="49" class="title">回旋漏斗 / vortex-funnel</text><text x="34" y="88" class="sub">结构、作用与状态设计示意；所有参数候选，未实施、未物理验证。</text><polygon points="92,319 348,430 348,445 92,337" class="deck"/><polygon points="452,430 708,319 708,337 452,445" class="deck"/><circle cx="179" cy="326" r="19" fill="white" stroke="#29444d" stroke-width="2"/><polyline points="211.00,332.00 310.00,405.00" class="move"/><rect x="298" y="589" width="205" height="24" rx="3" class="deck"/><circle cx="401" cy="560" r="19" fill="white" stroke="#29444d" stroke-width="2"/><polyline points="400.00,458.00 400.00,527.00" class="ghost"/><text x="73" y="240" class="label">外r4 / 外缘Y4.619</text><text x="326" y="482" class="label">孔直径1.3</text><text x="538" y="409" class="label">内唇Y3.4</text><text x="517" y="602" class="label">接台Y1.4</text><text x="104" y="665" class="label">中心投影需r≤.225，孔内没有底板</text><text x="977" y="166" class="label">重力回旋</text><text x="977" y="197" class="small">20°斜碗只靠接触/重力，无暗吸力。</text><text x="977" y="248" class="label">参考轨道</text><text x="977" y="279" class="small">r2.5时点质量参考v≈3.82m/s。</text><text x="977" y="330" class="label">过快会向外</text><text x="977" y="361" class="small">v5对应理想半径约4.29，大于外缘。</text><text x="977" y="412" class="label">出孔余速</text><text x="977" y="443" class="small">下落2m约.5s；横速1仍漂移.5m。</text><rect x="42.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="54.0" y="774" class="small">切向入碗</text><rect x="375.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="387.0" y="774" class="small">控速缩圈</text><rect x="708.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="720.0" y="774" class="small">真实落孔</text><rect x="1041.0" y="735" width="311.0" height="64" rx="3" class="deck"/><text x="1053.0" y="774" class="small">接台或落水</text><text x="34" y="850" class="sub">实线构件需对应真实碰撞；虚线为轨迹、作用区或备选姿态，不是隐藏承托。</text></svg>