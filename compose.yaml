services:
  marble-lab:
    image: ${MARBLE_IMAGE:-ghcr.io/zjj873994125/marble-lab:latest}
    ports:
      - "28083:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
